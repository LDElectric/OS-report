<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ordem de Serviço</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b1b1b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OS Fotos">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --amarelo: #FFBF00;
            --amarelo-escuro: #e0a800;
            --escuro: #1b1b1b;
            --cinza-fundo: #eef0f3;
            --branco: #ffffff;
            --texto: #1c1c1c;
            --texto-suave: #6b7280;
            --borda: #e4e7ec;
            --perigo: #e5484d;
            --raio: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
            background: var(--cinza-fundo);
            color: var(--texto);
            display: flex;
            flex-direction: column;
        }

        /* ===== APP BAR (topo) ===== */
        .appbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--escuro);
            color: #fff;
            padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.18);
        }
        .appbar .logo {
            width: 40px; height: 40px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        .appbar .ident {
            display: flex; flex-direction: column; line-height: 1.15; min-width: 0;
        }
        .appbar .ident .nome { font-weight: 700; font-size: 17px; letter-spacing: .3px; }
        .appbar .ident .subtitulo { font-size: 12px; color: #cfcfcf; }

        .appbar .btn-instalar {
            margin-left: auto;
            background: var(--amarelo);
            color: #000;
            border: none;
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(255,191,0,.35);
        }
        .btn-instalar.hidden { display: none; }

        /* ===== ÁREA DE CONTEÚDO ===== */
        .conteudo {
            flex: 1;
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .cartao {
            background: var(--branco);
            border: 1px solid var(--borda);
            border-radius: var(--raio);
            padding: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .cartao .titulo-cartao {
            display: flex; align-items: center; gap: 8px;
            font-weight: 700; font-size: 13px;
            text-transform: uppercase; letter-spacing: .6px;
            color: var(--texto-suave);
            margin-bottom: 14px;
        }
        .cartao .titulo-cartao .ponto { color: var(--amarelo); }

        .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .campo-full { grid-column: 1 / -1; }

        .campo { display: flex; flex-direction: column; gap: 6px; }
        .campo label { font-size: 12px; font-weight: 600; color: var(--texto-suave); }
        .campo input,
        .campo textarea {
            width: 100%;
            border: 1.5px solid var(--borda);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 16px;
            font-family: inherit;
            color: var(--texto);
            background: #fafbfc;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        .campo textarea { resize: vertical; min-height: 110px; }
        .campo input:focus,
        .campo textarea:focus {
            outline: none;
            border-color: var(--amarelo);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255,191,0,.25);
        }

        /* ===== FOTOS ===== */
        .fotos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .foto-item {
            position: relative;
            border: 2px dashed #cfd3da;
            border-radius: 14px;
            background: #f7f8fa;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: border-color .15s, transform .05s;
        }
        .foto-item:active { transform: scale(.99); }
        .foto-item.repleto { border-style: solid; border-color: transparent; }
        .foto-item input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; z-index: 5; }
        .foto-placeholder {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            color: var(--texto-suave); font-size: 12px; text-align: center; padding: 10px; pointer-events: none;
        }
        .foto-placeholder .icone { font-size: 42px; line-height: 1; }
        .foto-item img { width: 100%; height: 100%; max-height: 220px; object-fit: contain; border-radius: 12px; display: none; }
        .foto-item img.visivel { display: block; }
        .btn-remover-foto {
            position: absolute; top: 8px; right: 8px; z-index: 10;
            background: rgba(0,0,0,.62); color: #fff;
            border: none; border-radius: 999px; width: 26px; height: 26px;
            font-size: 14px; line-height: 1; cursor: pointer;
            display: none; align-items: center; justify-content: center;
        }
        .btn-remover-foto.visivel { display: inline-flex; }

        /* ===== BARRA INFERIOR DE AÇÕES ===== */
        .tabbar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 20;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--borda);
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            display: flex; gap: 12px;
            justify-content: center;
            max-width: 620px;
            margin: 0 auto;
        }
        .tabbar button {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 14px 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            transition: filter .15s, transform .05s;
        }
        .tabbar button:active { transform: scale(.98); }
        .btn-limpar { background: #eceef1; color: var(--texto); }
        .btn-limpar:hover { filter: brightness(.97); }
        .btn-print { background: var(--amarelo); color: #000; box-shadow: 0 6px 16px rgba(255,191,0,.35); }
        .btn-print:hover { filter: brightness(.96); }

        /* barra para celular desloca para ficar embaixo */
        @media (min-width: 621px) {
            .tabbar { left: 50%; transform: translateX(-50%); width: 100%; }
        }

        .status-salvo {
            text-align: center; font-size: 12px; color: var(--texto-suave);
            padding: 4px 0;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .status-salvo .ok { color: #2f9e44; font-weight: 700; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(20px);
            background: var(--escuro); color: #fff; padding: 12px 18px; border-radius: 12px;
            font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
            transition: opacity .25s, transform .25s; z-index: 40; max-width: 90%;
            box-shadow: 0 6px 20px rgba(0,0,0,.3);
        }
        .toast.mostrar { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== IMPRESSÃO: relatório A4 dedicado ===== */
        #printReport { display: none; }

        @media print {
            body { background: #fff; }
            .appbar, .conteudo, .tabbar, .status-salvo, .toast { display: none !important; }
            #printReport {
                display: block;
                width: 210mm; min-height: 297mm;
                background: #fff;
                padding: 15mm 18mm;
                color: #000;
                font-family: Arial, Helvetica, sans-serif;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            #printReport .p-titulo {
                font-size: 22px; font-weight: bold; text-align: center; letter-spacing: 2px;
                border-bottom: 3px solid #FFBF00; padding-bottom: 8px; margin-bottom: 12px;
            }
            #printReport .p-campos {
                display: flex; flex-wrap: wrap; gap: 8px 18px;
                margin-bottom: 10px;
            }
            #printReport .p-campo { flex: 1 1 150px; display: flex; flex-direction: column; }
            #printReport .p-label {
                font-size: 11px; font-weight: bold; color: #000; background: #FFBF00;
                padding: 2px 8px; border-radius: 3px; width: fit-content; margin-bottom: 2px;
            }
            #printReport .p-valor {
                border: 1px solid #aaa; border-radius: 3px; padding: 4px 6px; min-height: 24px;
                font-size: 13px; white-space: pre-wrap; word-break: break-word;
            }
            #printReport .p-secao { margin: 8px 0 4px; }
            #printReport .p-secao-label {
                font-size: 13px; font-weight: bold; color: #000; background: #FFBF00;
                padding: 3px 10px; border-radius: 3px; width: fit-content;
            }
            #printReport .p-desc {
                border: 1px solid #aaa; border-radius: 3px; padding: 8px; font-size: 13px;
                min-height: 80px; white-space: pre-wrap; word-break: break-word; margin-top: 4px;
            }
            #printReport .p-fotos {
                display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px;
            }
            #printReport .p-foto {
                border: 1px solid #ccc; border-radius: 4px; min-height: 110px; overflow: hidden;
                display: flex; align-items: center; justify-content: center;
            }
            #printReport .p-foto img { max-width: 100%; max-height: 170px; object-fit: contain; }
            #printReport .p-rodape {
                margin-top: 16px; border-top: 1px solid #aaa; padding-top: 8px;
                font-size: 11px; color: #666; display: flex; justify-content: space-between;
            }
            .p-sem-foto { color: #999; font-size: 11px; }
        }

        /* ===== Responsivo pequeno ===== */
        @media screen and (max-width: 420px) {
            .grade { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- ===== APPBAR ===== -->
    <header class="appbar">
        <img class="logo" src="icon.png" alt="Logo OS">
        <div class="ident">
            <span class="nome">Ordem de Serviço</span>
            <span class="subtitulo">Thermix • Fotos e Relatórios</span>
        </div>
        <button class="btn-instalar hidden" id="btnInstalar">📲 Instalar</button>
    </header>

    <!-- ===== CONTEÚDO (visual de app) ===== -->
    <main class="conteudo" id="formApp">

        <section class="cartao">
            <div class="titulo-cartao"><span class="ponto">●</span> Dados da OS</div>
            <div class="grade">
                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data">
                </div>
                <div class="campo">
                    <label for="numOS">Nº da OS</label>
                    <input type="text" id="numOS" placeholder="Ex: 001/2026" inputmode="text">
                </div>
                <div class="campo">
                    <label for="numPTS">Nº da PTS</label>
                    <input type="text" id="numPTS" placeholder="Ex: 12345" inputmode="numeric">
                </div>
                <div class="campo">
                    <label for="horimetro">Horímetro</label>
                    <input type="text" id="horimetro" placeholder="Ex: 1234,5 h" inputmode="decimal">
                </div>
            </div>
        </section>

        <section class="cartao">
            <div class="titulo-cartao"><span class="ponto">●</span> Equipamento & Equipe</div>
            <div class="grade">
                <div class="campo campo-full">
                    <label for="equipamento">Equipamento</label>
                    <input type="text" id="equipamento" placeholder="Ex: Trator X">
                </div>
                <div class="campo campo-full">
                    <label for="executantes">Executantes</label>
                    <input type="text" id="executantes" placeholder="Nome(s) do(s) executor(es)">
                </div>
            </div>
        </section>

        <section class="cartao">
            <div class="titulo-cartao"><span class="ponto">●</span> Descrição da Atividade</div>
            <div class="campo">
                <textarea id="descricao" placeholder="Descreva detalhadamente a atividade executada..."></textarea>
            </div>
        </section>

        <section class="cartao">
            <div class="titulo-cartao"><span class="ponto">●</span> Fotos da OS</div>
            <div class="fotos-grid" id="fotosGrid"></div>
        </section>

        <div class="status-salvo" id="statusSalvo"><span class="ok">✔</span> Salvo automaticamente neste dispositivo</div>
    </main>

    <!-- ===== BARRA DE AÇÕES ===== -->
    <footer class="tabbar">
        <button class="btn-limpar" id="btnLimpar">🗑️ Limpar</button>
        <button class="btn-print" id="btnPrint">🖨️ Imprimir / PDF</button>
    </footer>

    <!-- ===== TEMPLATE DE IMPRESSÃO (A4) ===== -->
    <div id="printReport"></div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== REGISTRO DO SERVICE WORKER (PWA) =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.log('Erro ao registrar Service Worker:', err));
            });
        }

        // ===== TOAST =====
        let toastTimer;
        function mostrarToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('mostrar');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('mostrar'), 2600);
        }

        // ===== INSTALAÇÃO DO APP =====
        let deferredPrompt = null;
        const btnInstalar = document.getElementById('btnInstalar');

        // Se já está rodando como app instalado, esconde o botão
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        if (isStandalone) { btnInstalar.classList.add('hidden'); }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!isStandalone) { btnInstalar.classList.remove('hidden'); }
        });

        btnInstalar.addEventListener('click', async () => {
            if (!deferredPrompt) { mostrarToast('Use o menu do navegador → "Adicionar à tela inicial"'); return; }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                btnInstalar.classList.add('hidden');
            }
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            btnInstalar.classList.add('hidden');
            mostrarToast('App instalado! ✔ Encontre o ícone na sua tela inicial.');
        });

        // ===== INICIALIZAÇÃO / AUTO-SAVE =====
        const inputData = document.getElementById('data');
        const camposSave = ['data', 'numOS', 'numPTS', 'equipamento', 'executantes', 'horimetro', 'descricao'];

        camposSave.forEach(id => {
            const el = document.getElementById(id);
            const saved = localStorage.getItem('os_cache_' + id);
            if (saved !== null) { el.value = saved; }
            el.addEventListener('input', () => {
                localStorage.setItem('os_cache_' + id, el.value);
            });
        });
        if (!inputData.value) { inputData.valueAsDate = new Date(); }

        // Horímetro "N/A" fallback
        const horimetro = document.getElementById('horimetro');
        horimetro.addEventListener('blur', () => {
            if (!horimetro.value.trim()) { horimetro.value = 'N/A'; localStorage.setItem('os_cache_horimetro','N/A'); }
        });
        horimetro.addEventListener('focus', () => {
            if (horimetro.value === 'N/A') { horimetro.value = ''; }
        });

        // ===== GERENCIADOR DE FOTOS =====
        const grid = document.getElementById('fotosGrid');
        let contadorFotos = 0;

        function criarItemFoto() {
            const item = document.createElement('div');
            item.className = 'foto-item';
            item.dataset.index = contadorFotos++;

            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.multiple = false;

            const placeholder = document.createElement('div');
            placeholder.className = 'foto-placeholder';
            placeholder.innerHTML = '<span class="icone">📷</span><span>Adicionar foto</span>';

            const img = document.createElement('img');
            img.alt = 'Foto';

            const btnRemover = document.createElement('button');
            btnRemover.className = 'btn-remover-foto';
            btnRemover.textContent = '✕';
            btnRemover.type = 'button';

            item.appendChild(input);
            item.appendChild(placeholder);
            item.appendChild(img);
            item.appendChild(btnRemover);
            grid.appendChild(item);

            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        img.src = event.target.result;
                        img.classList.add('visivel');
                        placeholder.style.display = 'none';
                        btnRemover.classList.add('visivel');
                        item.classList.add('repleto');
                    };
                    reader.readAsDataURL(file);
                } else {
                    limparItem(item);
                }
            });

            btnRemover.addEventListener('click', function(ev) {
                ev.stopPropagation();
                limparItem(item);
                input.value = '';
            });

            return item;
        }

        function limparItem(item) {
            const img = item.querySelector('img');
            const placeholder = item.querySelector('.foto-placeholder');
            const btnRemover = item.querySelector('.btn-remover-foto');
            const input = item.querySelector('input[type="file"]');
            img.src = '';
            img.classList.remove('visivel');
            placeholder.style.display = 'flex';
            btnRemover.classList.remove('visivel');
            item.classList.remove('repleto');
            input.value = '';
        }

        // Sempre garante que existam 2 espaços para adicionar foto
        function garantirSlots() {
            const itens = grid.querySelectorAll('.foto-item');
            const preenchidos = Array.from(itens).filter(i => i.classList.contains('repleto')).length;
            let livres = itens.length - preenchidos;
            while (livres < 2) { criarItemFoto(); livres++; }
        }

        criarItemFoto();
        criarItemFoto();

        // ===== LIMPAR =====
        document.getElementById('btnLimpar').addEventListener('click', () => {
            if (confirm('Tem certeza que deseja apagar todos os dados preenchidos?')) {
                camposSave.forEach(id => {
                    document.getElementById(id).value = '';
                    localStorage.removeItem('os_cache_' + id);
                });
                inputData.valueAsDate = new Date();
                grid.innerHTML = '';
                criarItemFoto();
                criarItemFoto();
                mostrarToast('Tudo limpo ✔');
            }
        });

        // ===== IMPRESSÃO (monta relatório A4) =====
        function valorOuVazio(id) {
            const el = document.getElementById(id);
            return el && el.value.trim() ? el.value.trim() : '';
        }

        function prepararImpressao() {
            const r = document.getElementById('printReport');

            const campos = [
                ['Data', valorOuVazio('data')],
                ['Nº da OS', valorOuVazio('numOS')],
                ['Nº da PTS', valorOuVazio('numPTS')],
                ['Equipamento', valorOuVazio('equipamento')],
                ['Executantes', valorOuVazio('executantes')],
                ['Horímetro', valorOuVazio('horimetro')]
            ];

            let html = '<div class="p-titulo">ORDEM DE SERVIÇO</div>';
            html += '<div class="p-campos">';
            campos.forEach(([label, valor]) => {
                html += `<div class="p-campo"><span class="p-label">${label}</span><div class="p-valor">${valor || ''}</div></div>`;
            });
            html += '</div>';

            const desc = valorOuVazio('descricao');
            if (desc) {
                html += '<div class="p-secao"><span class="p-secao-label">Descrição da Atividade</span></div>';
                html += `<div class="p-desc">${desc}</div>`;
            }

            // Fotos preenchidas
            const fotos = Array.from(grid.querySelectorAll('.foto-item'))
                .filter(i => i.classList.contains('repleto'))
                .map(i => i.querySelector('img').src);

            if (fotos.length) {
                html += '<div class="p-secao"><span class="p-secao-label">Fotos</span></div>';
                html += '<div class="p-fotos">';
                fotos.forEach(src => { html += `<div class="p-foto"><img src="${src}"></div>`; });
                html += '</div>';
            }

            const dataG = new Date().toLocaleDateString('pt-BR');
            html += '<div class="p-rodape">' +
                `<span>Gerado em: ${dataG}</span>` +
                '<span>OS - Template v3.0 (PWA)</span></div>';

            r.innerHTML = html;
        }

        document.getElementById('btnPrint').addEventListener('click', () => {
            prepararImpressao();
            window.print();
        });

        // Impressão via atalho Ctrl+P preserva o relatório
        window.addEventListener('beforeprint', prepararImpressao);
    </script>
</body>
</html>
