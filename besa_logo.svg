<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820">
  <!-- Borborema Energética S.A. — recriado do PNG original -->
  <!-- Símbolo: 3 ondas/arcos em tons de coral, deslocados na diagonal -->

  <defs>
    <path id="asa" d="M 150 150 C 240 305 345 395 465 365 C 565 340 655 215 705 95" />
  </defs>

  <!-- Contorno branco fino (destaca no fundo escuro) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="88">
    <use href="#asa" transform="translate(0,0)" />
    <use href="#asa" transform="translate(85,80)" />
    <use href="#asa" transform="translate(175,160)" />
  </g>

  <!-- Cores originais (coral: escuro -> médio -> claro) -->
  <g fill="none" stroke-linecap="round" stroke-width="74">
    <use href="#asa" transform="translate(0,0)" stroke="#F2816F" />
    <use href="#asa" transform="translate(85,80)" stroke="#F5998C" />
    <use href="#asa" transform="translate(175,160)" stroke="#F8BFAF" />
  </g>

  <!-- Texto (Borborema / Energética S.A.) com contorno branco fino -->
  <text x="400" y="600" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="700"
        fill="#1c1c1c" stroke="#ffffff" stroke-width="3.5" paint-order="stroke fill">Borborema</text>
  <text x="400" y="715" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="500" letter-spacing="2"
        fill="#1c1c1c" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">Energética S.A.</text>
</svg>
